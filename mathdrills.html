    <title>Math Drills</title>
    <style>
        :root{
            --pwidth: 800px;
            --numsize: 1.5em;
        }

        * {
            /* border: 2px solid black; */
        }

        body{
            width: var(--pwidth);
        }

        .header{
            text-align: center;
        }

        .problems-box{
            display: grid;
            grid-template-columns:  20% 20% 20% 20% 20%;
            width: var(--pwidth);
        }

        .individual-problem{
            display: flex;
            flex-direction: column;
        }

        .bottom-num, .top-num{
            font-size: var(--numsize);
        }

        .top-num{
            text-align: right;
            height: var(--numsize);
        }

        .bottom-box{
            /* border: 2px solid green; */
            display: flex;
            justify-content: end;
        }

        .operator{
            /* border: 2px solid pink; */
            font-size: var(--numsize);
        }

        .bottom-num{
            padding-left: 70%;
            /* border: 2px solid yellow; */
            height: var(--numsize);
        }

        .number-selection{
            display: grid;
            grid-template-columns: repeat(10, auto);
            justify-content: space-around;
        }

        .num-select{
            width: 50px;
            height: 50px;
            display: flex;
            margin: 1px;
            justify-content: center;
            align-items: center;
            font-size: 1.25rem;
            border: 2px solid black;
        }

        .op-select.active ,.num-select.active {
            background-color: lightblue;
        }

        .operator-selection{
            display: flex;
        }
        .op-select{
            width: 50px;
            height: 50px;
            display: flex;
            margin: 1px;
            justify-content: center;
            align-items: center;
            font-size: 1.25rem;
            border: 2px solid black;
        }

        .answer-box{
            height: 3.5rem;
        }

        .selections{
            display: flex;
            justify-content: space-around;
            margin-bottom: 10px;
        }

        .instructions-box{
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .generate{
            margin-right: 10%;
            height: 3rem;
            width: 10rem;
            font-size: 1.5rem;
        }

        .equals-line{
            border: 2px solid black;
            padding-left: 5px;
            padding-right: 5px;
        }

        .individual-problem{
            /* border: 2px solid blue; */
            margin-top: 5px;
            padding-right: 4px;
            padding-left: 4px;
            width: 80%;
        }

    </style>
</head>

    <script>
        let selectedNumber = 0;
        let selectedOperator;

        const numberSelectArray = document.querySelectorAll(".num-select");
        const operatorSelectArray = document.querySelectorAll(".op-select");
        const topNumberArray = document.querySelectorAll(".top-num");
        const bottomNumberArray = document.querySelectorAll(".bottom-num");
        const operatorArray = document.querySelectorAll(".operator");
        const generateButton = document.querySelector(".generate");

        console.log(generateButton);

        numberSelectArray.forEach(function(numButton) {
            numButton.addEventListener('click', function(event) {
                numberSelectArray.forEach(btn => btn.classList.remove('active'))
                selectedNumber = event.target.textContent;
                this.classList.add('active');
                topNumberArray.forEach(top => top.innerHTML = selectedNumber);
            });
        });

        operatorSelectArray.forEach(function(opButton) {
            opButton.addEventListener('click', function(event) {
                operatorSelectArray.forEach(btn => btn.classList.remove('active'))
                selectedOperator = event.target.textContent;
                this.classList.add('active');
                operatorArray.forEach(op => op.innerHTML = selectedOperator);
                console.log(selectedOperator);
            });
        });

        generateButton.addEventListener('click', function() {
            if (selectedOperator == "+") {
                for (i = 0; i <= bottomNumberArray.length; i++) {
                    let randomNum = Math.floor(Math.random() * 50) + 1;
                    bottomNumberArray[i].innerHTML = randomNum;
                    }
                };
                
            if (selectedOperator == "-") {
                for (i = 0; i <= bottomNumberArray.length; i++) {
                    let randomNum = Math.floor(Math.random() * selectedNumber) + 1;
                    bottomNumberArray[i].innerHTML = randomNum;
                    }
                };
            });
